<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Trial Request | GetTV.online</title>
    <meta name="description" content="Request a free trial of GetTV.online to test our server stability and compatibility with your device before you choose a subscription plan.">
    <link rel="canonical" href="https://gettv.online/trial.html">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gettv.online/trial.html">
    <meta property="og:title" content="Free Trial Request | GetTV.online">
    <meta property="og:description" content="Request a free trial of GetTV.online to test our server stability and compatibility with your device before you choose a subscription plan.">
    <meta property="og:image" content="https://gettv.online/assets/images/gettvonline.webp">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://gettv.online/trial.html">
    <meta property="twitter:title" content="Free Trial Request | GetTV.online">
    <meta property="twitter:description" content="Request a free trial of GetTV.online to test our server stability and compatibility with your device before you choose a subscription plan.">
    <meta property="twitter:image" content="https://gettv.online/assets/images/gettvonline.webp">
    
    <link rel="icon" type="image/svg+xml" href="assets/images/favlogo2.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-sans antialiased flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <!-- MAIN CONTENT AREA (This changes per page) -->
    <main class="flex-grow container mx-auto px-6 py-20 flex justify-center">
        <div class="bg-gray-800 p-10 rounded-xl max-w-lg w-full border border-gray-700 shadow-2xl">
            <h1 class="text-3xl font-bold mb-2 text-center">Request a Free Trial</h1>
            <p class="text-gray-400 text-sm mb-8 text-center">Test our server stability before you buy. Trials are delivered within 1-2 hours.</p>
            
            <form id="trial-form" class="space-y-4">
                <div>
                    <label for="trial-name" class="block text-sm text-gray-400 mb-1">Full Name</label>
                    <input id="trial-name" type="text" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label for="trial-email" class="block text-sm text-gray-400 mb-1">Email Address</label>
                    <input id="trial-email" type="email" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label for="trial-device" class="block text-sm text-gray-400 mb-1">Primary Device</label>
                    <select id="trial-device" name="device" class="mt-1 block w-full pl-3 pr-10 py-2 text-base bg-gray-700 border-gray-600 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md text-white" required>
                        <option value="">Select your device</option>
                        <option value="Smart TV (Samsung, LG, TCL)">Smart TV (Samsung, LG, TCL)</option>
                        <option value="Android Box / Firestick">Android Box / Firestick</option>
                        <option value="MAG Box">MAG Box</option>
                        <option value="Apple TV / iOS">Apple TV / iOS</option>
                        <option value="Windows / Mac">Windows / Mac</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div id="mac-address-container" class="hidden">
                    <label for="trial-mac" class="block text-sm text-gray-400 mb-1">MAC Address (for MAG Box)</label>
                    <input id="trial-mac" type="text" placeholder="00:1A:79:XX:XX:XX" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label for="trial-country" class="block text-sm text-gray-400 mb-1">Country</label>
                    <select id="trial-country" name="country" class="mt-1 block w-full pl-3 pr-10 py-2 text-base bg-gray-700 border-gray-600 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md text-white" required>
                        <option value="">Please select your country</option>
                        <option value="USA">United States</option>
                        <option value="Canada">Canada</option>
                        <option value="UK">United Kingdom</option>
                        <option value="Australia">Australia</option>
                        <option value="Germany">Germany</option>
                        <option value="France">France</option>
                        <option value="Spain">Spain</option>
                        <option value="Italy">Italy</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <!-- Message Container for Trial Form -->
                <div id="trial-message-container" class="hidden p-3 rounded-md border text-sm" role="alert">
                </div>
                <button id="trial-submit-btn" type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition mt-4">Send Trial Request</button>
            </form>
        </div>
    </main>

   <div id="footer-placeholder"></div>
  <script type="module" src="assets/js/firebase.js" defer></script>
    <script type="module" src="assets/js/app.js" defer></script>
    <script type="module" src="assets/js/trial.js" defer></script>
</body>
</html>
