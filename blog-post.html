<body class="bg-gray-900 text-white font-sans antialiased flex flex-col min-h-screen">

<div id="header-placeholder"></div>

    <!-- MAIN CONTENT AREA -->
    <main id="main-content" class="flex-grow container mx-auto px-6 py-12 md:py-20 max-w-3xl">
        <header id="post-header" class="mb-10">
            <!-- Category, title, and byline are injected here by build-blog.js -->

        <article id="post-content-container" class="prose prose-invert lg:prose-xl max-w-none">
            <!-- Post body is injected here by build-blog.js -->

        <div id="post-share" class="mt-10 pt-8 border-t border-gray-800">
            <!-- Share buttons are injected here by build-blog.js -->
        </div>

        <div class="mt-8 pt-8 border-t border-gray-800 text-center">

  <div id="footer-placeholder"></div>
   <script type="module" src="/assets/js/firebase.js" defer></script>
    <script type="module" src="/assets/js/app.js" defer></script>
    <script>
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('.js-copy-link');
            if (!btn) return;
            navigator.clipboard.writeText(btn.dataset.url).then(function () {
                var original = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check" aria-hidden="true"></i>';
                setTimeout(function () { btn.innerHTML = original; }, 1500);
            });
        });
    </script>
</body>
