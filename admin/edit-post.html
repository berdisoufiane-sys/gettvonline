<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post | GetTV.online CMS</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/admin/assets/css/admin.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/favlogo2.svg">
    <!-- Quill editor CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body class="bg-gray-800 text-gray-100">

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 p-6 flex flex-col">
            <div class="text-center mb-10">
                <img src="../assets/images/logogettv.svg" alt="Logo" class="h-12 w-auto mx-auto mb-2">
                <h1 class="text-xl font-bold text-white">Admin Panel</h1>
            </div>

            <nav class="flex-grow space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-tachometer-alt w-5 text-center"></i>
                    <span>Dashboard</span>
                </a>
                <a href="edit-post.html" class="flex items-center gap-3 px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">
                    <i class="fa-solid fa-file-alt w-5 text-center"></i>
                    <span>Posts</span>
                </a>
                <a href="dashboard.html#trial-requests" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-ticket w-5 text-center"></i>
                    <span>Free Trials</span>
                </a>
                <a href="dashboard.html#contact-messages" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-envelope-open-text w-5 text-center"></i>
                    <span>Contact Messages</span>
                </a>
                <a href="dashboard.html#newsletter-subscriptions" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-newspaper w-5 text-center"></i>
                    <span>Newsletter</span>
                </a>
                <a href="dashboard.html#channel-list-requests" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-list-alt w-5 text-center"></i>
                    <span>Channel Lists</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-cog w-5 text-center"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="mt-auto">
                <button id="logout-button" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg text-red-400 hover:bg-red-900/50 transition">
                    <i class="fa-solid fa-sign-out-alt w-5 text-center"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-10" style="visibility: hidden;">
            <h1 id="page-title" class="text-3xl font-bold mb-8">Create New Post</h1>
            
            <form id="post-form" class="space-y-6">
                <div>
                    <label for="post-title" class="block text-sm font-medium text-gray-300 mb-2">Post Title</label>
                    <input type="text" id="post-title" name="title" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label for="post-author" class="block text-sm font-medium text-gray-300 mb-2">Author</label>
                    <input type="text" id="post-author" name="author" required class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label for="post-status" class="block text-sm font-medium text-gray-300 mb-2">Status</label>
                    <select id="post-status" name="status" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500">
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                    </select>
                </div>
                <div>
                    <label for="post-image" class="block text-sm font-medium text-gray-300 mb-2">Cover Image</label>
                    <div class="flex items-center gap-4">
                        <input type="file" id="post-image" name="image" accept="image/*" class="w-full text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500">
                        <button type="button" id="remove-image-btn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-lg transition hidden">Remove</button>
                    </div>
                    <img id="image-preview" src="" alt="Image Preview" class="mt-4 rounded-lg max-h-64 hidden">
                </div>
                <div>
                    <label for="editor-container" class="block text-sm font-medium text-gray-300 mb-2">Content</label>
                    <!-- Quill editor container -->
                    <div id="editor-container" class="bg-white text-gray-900 rounded-lg"></div>
                </div>
                <div>
                    <button type="submit" id="save-post-btn" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-6 rounded-lg transition">
                        Save Post
                    </button>
                    <a href="dashboard.html" class="ml-4 text-gray-400 hover:text-white">Cancel</a>
                </div>
            </form>
        </main>
    </div>

    <!-- Quill editor JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script type="module" src="../assets/js/firebase.js"></script>
    <script type="module" src="edit-post.js"></script>
</body>
</html>
