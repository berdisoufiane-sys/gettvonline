<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GetTV.online CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="icon" type="image/svg+xml" href="../assets/images/favlogo2.svg">
</head>
<body class="bg-gray-800 text-gray-100">

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 p-6 flex flex-col">
            <div class="text-center mb-10">
                <img src="../assets/images/logogettv.svg" alt="Logo" class="h-12 w-auto mx-auto mb-2">
                <h1 class="text-xl font-bold text-white">Admin Panel</h1>
            </div>

            <nav class="flex-grow space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">
                    <i class="fa-solid fa-tachometer-alt w-5 text-center"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-envelope-open-text w-5 text-center"></i>
                    <span>Contact Messages</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-newspaper w-5 text-center"></i>
                    <span>Newsletter</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-ticket w-5 text-center"></i>
                    <span>Free Trials</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-users w-5 text-center"></i>
                    <span>Users</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-gray-700 transition">
                    <i class="fa-solid fa-cog w-5 text-center"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="mt-auto">
                <button id="logout-button" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg text-red-400 hover:bg-red-900/50 transition">
                    <i class="fa-solid fa-sign-out-alt w-5 text-center"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-10">
            <h1 class="text-3xl font-bold mb-8">Dashboard</h1>
            
            <!-- Trial Requests Section -->
            <section class="mb-12">
                <h2 class="text-2xl font-semibold mb-4 text-blue-400">Free Trial Requests</h2>
                <div class="bg-gray-900 rounded-lg shadow-lg overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left text-gray-300">
                            <thead class="text-xs text-gray-400 uppercase bg-gray-700">
                                <tr>
                                    <th scope="col" class="px-6 py-3">Date</th>
                                    <th scope="col" class="px-6 py-3">Name</th>
                                    <th scope="col" class="px-6 py-3">Email</th>
                                    <th scope="col" class="px-6 py-3">Device</th>
                                    <th scope="col" class="px-6 py-3">Country</th>
                                    <th scope="col" class="px-6 py-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="trial-requests-body">
                                <!-- Rows will be inserted here by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Contact Messages Section -->
            <section class="mb-12">
                <h2 class="text-2xl font-semibold mb-4 text-blue-400">Contact Messages</h2>
                <div class="bg-gray-900 rounded-lg shadow-lg overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left text-gray-300">
                            <thead class="text-xs text-gray-400 uppercase bg-gray-700">
                                <tr>
                                    <th scope="col" class="px-6 py-3">Date</th>
                                    <th scope="col" class="px-6 py-3">Email</th>
                                    <th scope="col" class="px-6 py-3">Message</th>
                                    <th scope="col" class="px-6 py-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="contact-messages-body">
                                <!-- Rows will be inserted here by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

<script type="module" src="../assets/js/firebase.js"></script>
<script type="module" src="dashboard.js"></script>
</body>
</html>
