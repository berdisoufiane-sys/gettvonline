<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO tags will be updated by JavaScript -->
    <title>GetTV Tech Blog</title>
    <meta name="description" content="Read the latest articles and guides from the GetTV.online team.">
    
    <link rel="icon" type="image/svg+xml" href="assets/images/favlogo2.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased flex flex-col min-h-screen">

<div id="header-placeholder"></div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow container mx-auto px-6 py-12 md:py-20 max-w-4xl">
        <!-- Post content will be injected here by JavaScript -->
        <div id="post-content-container">
            <div class="text-center">
                <p class="text-gray-400">Loading post...</p>
                <div class="mt-4 w-16 h-16 border-4 border-dashed rounded-full animate-spin border-blue-500 mx-auto"></div>
            </div>
        </div>

        <div class="mt-12 pt-8 border-t border-gray-700">
            <a href="blog.html" class="text-blue-400 hover:text-blue-300 font-semibold"><i class="fa-solid fa-arrow-left mr-2"></i> Back to Blog</a>
        </div>
    </main>

  <div id="footer-placeholder"></div>
   <script type="module" src="assets/js/firebase.js"></script>
    <script type="module" src="assets/js/app.js"></script>
    <script type="module" src="assets/js/post.js"></script>
</body>
</html>
