  <p>UK television is built around a mix of funding models that shapes how each broadcaster operates, public service, commercial free-to-air, and subscription. Knowing which is which makes it easier to understand what you're actually watching and why the same broadcaster might show up differently across a cable box, an aerial, or a streaming app.</p>

  <h2 id="public-service">Public service broadcasters</h2>
  <p>The BBC is the UK's main public service broadcaster, funded by the television licence fee rather than advertising, and operates several channels (BBC One, BBC Two, and others) alongside BBC iPlayer for catch-up and on-demand viewing. As a public broadcaster, it carries specific obligations around impartial news coverage and UK-wide programming that commercial channels don't have.</p>

  <h2 id="commercial-free-to-air">Commercial free-to-air channels</h2>
  <p>ITV, Channel 4, and Channel 5 are the UK's main commercial free-to-air networks, funded primarily through advertising rather than a licence fee. Channel 4 is publicly owned but commercially funded, a middle model between the BBC and fully commercial broadcasters. Each also runs its own streaming service, ITVX, Channel 4's streaming platform, and My5, for on-demand and catch-up content.</p>

  <h2 id="pay-tv-and-streaming">Pay-TV and streaming platforms</h2>
  <p>Sky is the largest pay-TV provider in the UK, offering satellite and internet-delivered packages that bundle in additional channels, sports, and movies beyond the free-to-air lineup. Alongside it, general streaming services like Netflix and Amazon Prime Video have become a standard part of the UK viewing mix, sitting outside the traditional broadcast structure entirely and offering on-demand libraries rather than scheduled channels.</p>

  <h2 id="how-to-access">How people typically access these channels</h2>
  <p>Free-to-air channels (BBC, ITV, Channel 4, Channel 5, and others) are available over Freeview via a standard aerial, no subscription required beyond the licence fee for BBC content. Pay-TV bundles like Sky add channels on top of that. IPTV subscriptions are another route some viewers use to consolidate a broad channel lineup, live and on-demand, into a single app rather than juggling several separate ones.</p>

    <h2>FAQ</h2>
    <h3>What's the difference between BBC and ITV?</h3>
    <p>The BBC is funded by the television licence fee and carries public service obligations. ITV is commercially funded through advertising and doesn't carry the same licence-fee-related obligations.</p>

    <h3>Do I need a TV licence to watch ITV or Channel 4?</h3>
    <p>In the UK, a TV licence is required to watch or record any live TV broadcast, regardless of channel, and to use BBC iPlayer. Check current UK TV licensing rules directly for your specific situation.</p>
