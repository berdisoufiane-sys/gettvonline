  <h2 id="before-you-start">Before you start</h2>
  <p>You'll need three things: a stable internet connection (wired where possible), a compatible device, and your GetTV.online activation details, which are sent automatically after your <a href="/trial">free trial</a> or subscription is confirmed.</p>

  <h2 id="smart-tvs">Smart TVs</h2>
  <p>Most modern Smart TVs support IPTV apps directly through their app store. Search for a supported player, install it, and enter the connection details we send you. If your TV doesn't support the app natively, an inexpensive streaming stick or box solves that instantly.</p>

  <h2 id="android-fire-tv">Android devices and Fire TV</h2>
  <p>Android phones, tablets, Android TV boxes, and Fire TV all use the same core apps available on the Google Play Store or Amazon Appstore. Sideloading is rarely necessary since our recommended apps are available directly in both stores.</p>

  <h2 id="mag-boxes">MAG boxes</h2>
  <p>MAG devices connect using their built-in portal settings rather than an app. If you're on a MAG box, our support team needs your device's MAC address to activate your line — the <a href="/trial">trial request form</a> has a dedicated field for this.</p>

  <h2 id="troubleshooting-buffering">Troubleshooting buffering</h2>
  <p>Most playback issues come down to network stability rather than the service itself. Connect by Ethernet where possible, close other bandwidth-heavy apps during streaming, and avoid Wi-Fi extenders with weak signal to the router.</p>

  <p>Still stuck? <a href="/contact">Contact support</a> and we'll help you get set up on your specific device.</p>
