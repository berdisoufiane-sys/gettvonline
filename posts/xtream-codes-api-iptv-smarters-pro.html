  <h2 id="what-is-xtream-codes">What Xtream Codes API actually is</h2>
  <p>Xtream Codes started as panel software IPTV providers use to manage subscriber accounts, channel lineups, and billing, and its API became a de facto standard connection method: a username, password, and server address that a player app queries to pull your channel list, EPG, and video-on-demand catalog. Many providers that don't run the original Xtream Codes software still expose a compatible API, since it's become the common format player apps expect.</p>

  <h2 id="xtream-vs-m3u">Xtream Codes vs. a static M3U playlist</h2>
  <p>A static M3U file is a fixed list, updating it means generating and reloading a new file. An Xtream Codes login is dynamic: the player queries the server live each time, so channel changes, EPG updates, and new VOD content show up without you having to manually refresh anything. That's the main practical advantage, less maintenance on your end.</p>

  <h2 id="setting-up">Setting it up in IPTV Smarters Pro</h2>
  <ol>
    <li>Open IPTV Smarters Pro and choose to add a new user or playlist.</li>
    <li>Select the Xtream Codes API login option (as opposed to M3U URL).</li>
    <li>Enter your provider's server URL, username, and password exactly as sent to you.</li>
    <li>Save, and give the app a moment to load your channel list and EPG.</li>
  </ol>
  <p>A typo in the server URL or password is the most common reason this step fails, copy and paste the details directly rather than retyping them by hand.</p>

  <h2 id="troubleshooting">Troubleshooting a failed connection</h2>
  <ul>
    <li><strong>"Invalid credentials" error:</strong> Double-check for extra spaces or line breaks copied along with the username or password.</li>
    <li><strong>Connects but no channels load:</strong> Confirm your subscription or trial is actually active, not just that the login details were accepted.</li>
    <li><strong>Works intermittently:</strong> This usually points to a network issue on your end rather than the API itself, test on a different network to isolate the cause.</li>
  </ul>
