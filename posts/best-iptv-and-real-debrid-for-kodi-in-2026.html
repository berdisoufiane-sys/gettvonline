  <h2 id="what-is-iptv">What is IPTV?</h2>
  <p>IPTV (Internet Protocol Television) delivers TV channels and on-demand video over an internet connection instead of a traditional cable or satellite signal. On Kodi, IPTV is typically accessed through an add-on like IPTV Simple Client, configured with a playlist (M3U) and program guide (EPG) supplied by whichever provider you're subscribed to.</p>

  <h2 id="what-is-real-debrid">What is Real-Debrid?</h2>
  <p><a href="https://real-debrid.com/" target="_blank" rel="noopener noreferrer">Real-Debrid</a> is a subscription "unrestricted downloader" — a legitimate cloud service that generates faster, premium download and streaming links from supported file-hosting services. It isn't a content provider itself; it's infrastructure that other tools point to. On Kodi, it's most often connected through the ResolveURL add-on so that compatible add-ons can request premium links through it.</p>

  <p>The most important row in that table is the last one. Neither IPTV nor Real-Debrid is inherently illegal — both are legal technologies. What determines whether a given setup is legal is the same question in both cases: does the source you're pulling from have the rights to distribute that content?</p>

  <h2 id="why-paired">Why Kodi users pair them</h2>
  <p>People combine IPTV add-ons with Real-Debrid on Kodi because it centralizes live TV and on-demand content in one interface, and because Real-Debrid's premium links tend to be more stable than free, unauthenticated sources. That reliability is genuinely useful — the catch is that reliability doesn't say anything about where the underlying content is actually licensed from, and a large share of the add-ons built around this pairing pull from unlicensed sources.</p>

  <h2 id="legal-privacy">Legal and privacy considerations</h2>
  <p>This is the part worth taking seriously before building a setup:</p>
  <ul>
    <li><strong>Content licensing is what matters, not the tools.</strong> Kodi is open-source software and legal to use. Real-Debrid is a legal cloud service. Neither fact tells you whether a specific add-on or IPTV source has the rights to the content it streams — that's a separate question you have to answer for each source.</li>
    <li><strong>"Gray area" isn't the same as "safe."</strong> Many unofficial Kodi add-ons and cheap IPTV resellers operate by streaming content they don't hold rights to. Depending on your country, accessing that content can carry real legal exposure, not just a theoretical one.</li>
    <li><strong>Privacy is a separate concern from legality.</strong> Any service handling your login and payment details should be treated carefully regardless of legal status — stick to providers that are transparent about who runs them and how they handle your data.</li>
    <li><strong>A VPN reduces exposure but doesn't make an illegal source legal.</strong> It's a reasonable privacy layer, not a legal shield.</li>
  </ul>
  <p>If you're not confident every source in your setup is properly licensed, that uncertainty is the actual risk — not a hypothetical one.</p>
