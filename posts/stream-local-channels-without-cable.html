  <h2 id="antenna-option">Option 1: An antenna, digital or networked</h2>
  <p>A digital HD antenna picks up free over-the-air broadcasts directly, no subscription required, but it only feeds a TV with a built-in tuner or a dedicated tuner box. If you want that signal on a streaming device without a tuner, a networked tuner box like a Tablo or HDHomeRun connects to your antenna and streams the signal to an app on your Roku, Fire TV, phone, or other device over your home network. Reception depends on distance from broadcast towers and any obstructions, positioning the antenna near a window or higher up can meaningfully improve results.</p>

  <h2 id="network-apps">Option 2: Network and streaming-service apps</h2>
  <p>Many local network affiliates offer their own app with live or next-day content, sometimes free, sometimes requiring a TV-provider login. Separately, several cable-replacement streaming services (the kind that bundle live channels for a monthly fee) include local affiliates in specific markets as part of their channel lineup, worth checking directly since local coverage varies significantly by service and by your specific area.</p>

    <h2>FAQ</h2>
    <h3>Do I need cable to watch local news?</h3>
    <p>No. A digital antenna, a networked tuner device, or a network affiliate's own app can all deliver local news without a cable subscription.</p>

    <h3>Why can't I find local channels after scanning with my antenna?</h3>
    <p>Reception depends on distance from broadcast towers and obstructions. Repositioning the antenna near a window or higher up, or using a higher-gain antenna, often helps.</p>

    <h3>What does a networked tuner device actually do?</h3>
    <p>It connects to your own antenna and streams the over-the-air signal to an app on devices that don't have a built-in tuner, effectively adding tuner functionality to a Roku, Fire TV, or similar device.</p>
