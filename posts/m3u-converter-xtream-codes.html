  <h2 id="what-is-m3u">What is an M3U file?</h2>
  <p>An M3U file is a plain text playlist format: a list of media URLs, one per line, that a player reads and turns into a browsable list. The format dates back to early MP3 players, where an M3U file just listed paths to audio tracks. IPTV players extended it into "M3U Plus," adding metadata (channel name, logo, group) alongside each stream link, which is what turns a bare list of URLs into a proper channel guide.</p>

  <h2 id="how-to-create">How to create or make an M3U file</h2>
  <p>For IPTV, you don't usually write an M3U file by hand, your provider generates it from your account. The URL above is exactly that: a link that, when opened by a player, returns the M3U file contents on the fly rather than a static file. If you specifically need a downloadable file instead of a live URL, most browsers let you save the URL's response directly (open the generated link, then use your browser's save-page option), though a live URL is generally more reliable since it reflects channel updates automatically.</p>

  <h2 id="m3u-vs-wpl">M3U vs. WPL, and MP3 playlists</h2>
  <p>WPL (Windows Media Player Playlist) is Microsoft's own XML-based playlist format, functionally similar to M3U but not interchangeable without conversion, since the two use different internal structures. If your goal is a simple audio playlist (an MP3-to-M3U conversion, for example), that's a different, much simpler task than IPTV: it just means listing local file paths in a text file, one per line, saved with an .m3u extension, no server, username, or password involved. That's a distinct use of the same file format from the IPTV M3U URLs this tool works with.</p>

  <h2 id="regional-packs">M3U playlists with regional channel packs</h2>
  <p>Many IPTV providers organize their channel lineup into regional packs, African, European, and others, within a single M3U Plus feed, using the group metadata mentioned earlier to sort channels by region in a player's guide. Whether a specific pack is included depends entirely on your provider's actual channel lineup, worth confirming directly rather than assuming from the file format alone.</p>

  <script>
  (function () {
    var tabCreate = document.getElementById('m3u-tab-create');
    var tabParse = document.getElementById('m3u-tab-parse');
    var panelCreate = document.getElementById('m3u-panel-create');
    var panelParse = document.getElementById('m3u-panel-parse');

    function showCreate() {
      panelCreate.classList.remove('hidden');
      panelParse.classList.add('hidden');
      tabCreate.classList.add('text-blue-400', 'border-blue-500');
      tabCreate.classList.remove('text-gray-400', 'border-transparent');
      tabParse.classList.remove('text-blue-400', 'border-blue-500');
      tabParse.classList.add('text-gray-400', 'border-transparent');
    }
    function showParse() {
      panelParse.classList.remove('hidden');
      panelCreate.classList.add('hidden');
      tabParse.classList.add('text-blue-400', 'border-blue-500');
      tabParse.classList.remove('text-gray-400', 'border-transparent');
      tabCreate.classList.remove('text-blue-400', 'border-blue-500');
      tabCreate.classList.add('text-gray-400', 'border-transparent');
    }
    tabCreate.addEventListener('click', showCreate);
    tabParse.addEventListener('click', showParse);

    document.getElementById('m3u-generate').addEventListener('click', function () {
      var host = document.getElementById('m3u-host').value.trim();
      var user = document.getElementById('m3u-user').value.trim();
      var pass = document.getElementById('m3u-pass').value.trim();
      if (!host || !user || !pass) return;
      if (!/^https?:\/\//i.test(host)) host = 'http://' + host;
      host = host.replace(/\/+$/, '');
      var url = host + '/get.php?username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass) + '&type=m3u_plus&output=ts';
      var out = document.getElementById('m3u-create-output');
      out.value = url;
      document.getElementById('m3u-create-copy').dataset.url = url;
      document.getElementById('m3u-create-result').classList.remove('hidden');
    });

    document.getElementById('m3u-parse-btn').addEventListener('click', function () {
      var input = document.getElementById('m3u-url-input').value.trim();
      var errorEl = document.getElementById('m3u-parse-error');
      var resultEl = document.getElementById('m3u-parse-result');
      try {
        var parsed = new URL(input);
        var host = parsed.protocol + '//' + parsed.host;
        var user = parsed.searchParams.get('username') || '';
        var pass = parsed.searchParams.get('password') || '';
        document.getElementById('m3u-parse-host').value = host;
        document.getElementById('m3u-parse-user').value = user;
        document.getElementById('m3u-parse-pass').value = pass;
        var copyBtns = document.querySelectorAll('.m3u-parse-copy');
        for (var i = 0; i < copyBtns.length; i++) {
          var btn = copyBtns[i];
          var target = document.getElementById(btn.dataset.target);
          btn.dataset.url = target.value;
        }
        resultEl.classList.remove('hidden');
        errorEl.classList.add('hidden');
      } catch (e) {
        resultEl.classList.add('hidden');
        errorEl.textContent = "That doesn't look like a valid URL. Check it and try again.";
        errorEl.classList.remove('hidden');
      }
    });
  })();
  </script>
