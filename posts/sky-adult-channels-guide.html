  <h2 id="what-channels-exist">What's included</h2>
  <p>Sky offers a small set of adult-oriented premium channels as an add-on, separate from its standard channel packages. Exact channel names and availability can vary by package and region, so it's worth confirming the current lineup directly in your Sky account rather than relying on an outside list.</p>

  <h2 id="how-access-works">How access and billing work</h2>
  <p>Adult channel add-ons on Sky are billed separately from your core subscription and can typically be added or removed through your Sky account online or by contacting Sky support directly. As with any add-on, confirm current pricing for your specific account before subscribing.</p>

  <h2 id="parental-controls">Setting up parental controls</h2>
  <p>Both Sky Q and Sky Glass include PIN-protected parental controls that can restrict adult content at the device level, independent of whether the add-on is active on the account. On Sky Q, this is managed through Settings &gt; Parental Controls; on Sky Glass, through the equivalent settings menu. Set a PIN that isn't shared with anyone you want restricted, and consider setting content ratings limits in addition to blocking specific channels outright.</p>

  <h2 id="gettv-note">A note on IPTV packages</h2>
  <p>Some IPTV subscriptions bundle adult content as part of their standard package rather than as a separate paid add-on; GetTV.online's plans include this as part of the overall lineup. The same principle applies regardless of provider: use the parental controls available to manage access on any shared device.</p>
