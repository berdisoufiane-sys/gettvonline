  <h2 id="what-channels-exist">What's included</h2>
  <p>Adult premium channels, such as Hustler TV, are offered by Spectrum as a separate add-on tier, distinct from standard cable and premium movie channels. Availability varies by region and package, so the specific channel list is worth confirming directly with Spectrum for your account rather than assuming it matches every market.</p>

  <h2 id="how-billing-works">How billing and access work</h2>
  <p>Adult channel add-ons are typically billed as a monthly charge on top of your existing cable package, and can usually be added or removed through your account settings or by contacting support directly. As with any premium add-on, confirm the exact price for your account before subscribing, since regional pricing can differ.</p>

  <h2 id="parental-controls">Managing parental controls</h2>
  <p>Cable providers generally offer PIN-protected parental controls that can restrict or fully block adult channels at the set-top box level, independent of whether the add-on is active on the account. This is the most reliable way to manage access on a shared household TV; check your specific equipment's settings menu for parental control or channel lock options, and set a PIN that isn't shared with anyone you want restricted.</p>

  <h2 id="gettv-note">A note on IPTV packages</h2>
  <p>Some IPTV subscriptions bundle adult content channels as part of their standard package rather than as a separate add-on; GetTV.online's plans include this as part of the overall lineup. As with any provider, use the account-level parental controls available to manage access on shared devices.</p>
