  <p>Getting local channels on Roku depends on which kind of Roku you actually have, and a lot of guides skip that distinction. Here's how to tell what applies to your device, and the realistic options either way.</p>

  <h2 id="why-it-matters">Why local channels matter</h2>
  <p>Local channels carry your regional news, weather, and network affiliate programming (ABC, CBS, NBC, FOX, PBS, and others) — content that national streaming apps generally don't include. For live sports broadcasts and severe weather coverage specifically, a local affiliate is often the only source.</p>

  <h2 id="which-roku">Which Roku do you have?</h2>
  <p>This is the detail most guides skip, and it changes everything below: <strong>"Roku TV" is a specific product line</strong> — actual televisions (made by TCL, Hisense, and others) that run Roku's software and include a built-in ATSC tuner and antenna input. <strong>Standalone Roku devices</strong> — the Streaming Stick, Roku Express, Roku Ultra — are just streaming players. They have no tuner and nothing to plug an antenna into, regardless of what a universal "connect your antenna to the TV port" instruction might suggest.</p>
  <p>Check your model before following antenna instructions: if you have a Roku Streaming Stick, Express, or Ultra (not built into your TV), skip to streaming options below.</p>

  <h2 id="roku-tv-antenna">Roku TV: antenna and channel scanning</h2>
  <p>If you have an actual Roku TV with a built-in tuner:</p>
  <ol>
    <li>Connect an HD antenna to the antenna/coaxial input on the back of the TV (not any of the HDMI ports).</li>
    <li>From the Home screen, go to <strong>Settings</strong> &gt; <strong>TV inputs</strong> (or "Antenna TV," depending on model).</li>
    <li>Select <strong>Antenna TV</strong> and start a channel scan.</li>
    <li>Your Roku TV will detect and save available over-the-air channels for your area.</li>
  </ol>
  <p>Reception depends on your distance from broadcast towers and any obstructions — a higher-gain antenna or better placement (near a window, higher up) can meaningfully improve results.</p>

  <h2 id="streaming-roku">Streaming Roku devices: your options</h2>
  <p>If your Roku device doesn't have a tuner, you have two realistic paths instead of an antenna:</p>
  <ul>
    <li><strong>Network affiliate apps.</strong> Many local stations and networks offer their own Roku channel with live or next-day local content, often free with a cable/streaming provider login.</li>
    <li><strong>A separate over-the-air tuner device</strong> (like a Tablo or HDHomeRun) connected to your own antenna, which streams the antenna signal to a Roku channel app over your home network — effectively adding tuner functionality to a device that doesn't have one built in.</li>
  </ul>

  <section id="faq">
    <h2>FAQ</h2>
    <h3>Can I plug an antenna into any Roku device?</h3>
    <p>No — only Roku TV models (actual televisions running Roku's software) have a built-in tuner and antenna input. Standalone streaming devices like the Roku Stick, Express, or Ultra don't have anywhere to connect an antenna.</p>

    <h3>How do I get local channels without a Roku TV?</h3>
    <p>Install your local network affiliates' own Roku channels if available, or use a separate networked antenna/tuner device (like a Tablo or HDHomeRun) that streams to a Roku app.</p>

    <h3>Why can't I find channels after scanning?</h3>
    <p>Reception depends on distance from broadcast towers and obstructions. Try repositioning the antenna near a window or higher up, or consider a higher-gain antenna.</p>
