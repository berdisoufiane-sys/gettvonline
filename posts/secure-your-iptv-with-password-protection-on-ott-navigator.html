  <p>If you use <a href="https://play.google.com/store/apps/details?id=com.ottnavigator.iptvnavigator" target="_blank" rel="noopener noreferrer">OTT Navigator</a> to watch your IPTV subscription, locking it with a password takes about a minute and stops anyone else on your device — kids, roommates, anyone borrowing the TV — from opening your live channels or changing your setup. Here's what the feature does, how to turn it on, and a few other habits worth adopting alongside it.</p>

  <h2>What is OTT Navigator?</h2>
  <p>OTT Navigator is a third-party IPTV player app for Android, Android TV, and Fire TV. It doesn't provide any channels or content itself — instead, you load it with the connection details (an M3U playlist or Xtream Codes login) from your IPTV provider, and it handles playback, an electronic program guide, and DVR-style recording. Many GetTV.online subscribers use it as one of several supported players, alongside our own <a href="/tutorial">setup guide</a> for other devices.</p>
  <p>Because the app itself doesn't require a login by default, anyone with access to your TV or box can open it and start watching — which is exactly what its password/PIN lock is meant to prevent.</p>

  <h2>Why password-protect your IPTV app</h2>
  <p>A password on OTT Navigator isn't about protecting the channels themselves — it's about controlling who can use your device and your subscription. A few concrete reasons it's worth the minute it takes:</p>
  <ul>
    <li><strong>Prevent accidental changes.</strong> Kids or guests fiddling with the remote can't reconfigure your playlist or delete your recordings.</li>
    <li><strong>Restrict content.</strong> A PIN lock keeps mature channels or on-demand content out of reach when you're not around to supervise.</li>
    <li><strong>Protect your subscription.</strong> If your device is shared or your box is in a common area, a lock keeps your IPTV login from being casually reused or exposed.</li>
  </ul>

  <h2>How to set up password protection in OTT Navigator</h2>
  <p>The exact menu wording can vary slightly between OTT Navigator versions, but the general path is the same:</p>
  <ol>
    <li>Open OTT Navigator and go to <strong>Settings</strong>.</li>
    <li>Look for <strong>Parental control</strong> or <strong>Security</strong> in the settings list.</li>
    <li>Enable the PIN/password lock option.</li>
    <li>Set a PIN that isn't easy to guess — avoid obvious ones like 0000 or 1234.</li>
    <li>Confirm the PIN when prompted.</li>
    <li>If the app offers it, choose whether the lock applies to the whole app or just specific categories (e.g., adult content).</li>
  </ol>
  <p>Once it's set, OTT Navigator will ask for the PIN before opening the app or the categories you've restricted, depending on how you configured it.</p>

  <h2>Other ways to keep your IPTV account secure</h2>
  <p>A device-level PIN is one layer. A few others worth pairing it with:</p>
  <ul>
    <li><strong>Use a unique password</strong> for your IPTV provider account — not one reused from another service.</li>
    <li><strong>Don't share your Xtream Codes or M3U login</strong> outside your household; most IPTV plans are licensed per user.</li>
    <li><strong>Keep the app updated</strong> so you're not missing security fixes.</li>
    <li><strong>Use a connection with built-in privacy protection</strong> where you can — GetTV.online plans include an <a href="/pricing">integrated VPN</a>, so you're not relying on the player app alone for privacy.</li>
  </ul>

  <h2>Using OTT Navigator with GetTV.online</h2>
  <p>If you're setting this up for a GetTV.online subscription, OTT Navigator is one of several apps that work well with our service on Android-based devices. For a walkthrough covering Smart TVs, Fire TV, and other players, see our <a href="/tutorial">setup guide</a>, or <a href="/trial">request a free trial</a> if you're still deciding on a provider and want to test compatibility with your device first.</p>
